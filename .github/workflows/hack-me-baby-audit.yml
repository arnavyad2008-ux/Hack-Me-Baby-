name: Hack Me Baby CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  adversarial-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Heuristic pattern scan (advisory)
        run: npm run ci:audit

name: Hack Me Baby Adversarial Code Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  adversarial-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Hack Me Baby Dual-Agent Audit
        id: audit
        run: npm run ci:audit
